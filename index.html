<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1978 Chrysler Sigma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* One full-screen driving view with a dark instrument overlay. The look is fixed: it does not follow the page theme. */
  :root {
    color-scheme: dark;
    --bg: #1b2229; --panel: rgba(20, 27, 33, 0.78); --fg: #f2f5f7; --muted: #b3bec8; --line: rgba(255, 255, 255, 0.16); --accent: #ff6a1a;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  .stage { position: fixed; inset: 0; background: #b9d0e4; }
  #gl { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .hud { position: fixed; pointer-events: none; display: flex; gap: 10px; }
  .hud > * { pointer-events: auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); }
  .tl { top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); flex-direction: column; align-items: flex-start; max-width: min(62vw, 340px); }
  .dash { padding: 10px 14px 10px; min-width: 150px; }
  .dash h1 { margin: 0 0 2px; font: 600 12px/1.2 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .speedrow { display: flex; align-items: baseline; gap: 6px; }
  #speed { font: 600 44px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
  .unit { color: var(--muted); font-size: 13px; }
  #street { font-weight: 600; font-size: 15px; margin-top: 4px; overflow-wrap: anywhere; }
  #info { color: var(--muted); font-size: 12.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tr { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); flex-direction: column; align-items: flex-end; }
  #map { width: 168px; height: 168px; display: block; border-radius: 11px; }
  .mapwrap { padding: 0; overflow: hidden; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn, select {
    font: 500 13px/1 var(--font); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 13px; cursor: pointer; backdrop-filter: blur(6px);
  }
  select { max-width: 168px; appearance: none; -webkit-appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  select option { color: #111; background: #fff; }
  .btn:hover, select:hover { border-color: rgba(255, 255, 255, 0.4); }
  .btn:focus-visible, select:focus-visible, #gl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bl { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); flex-direction: column; align-items: flex-start; max-width: 70vw; }
  .help { padding: 8px 12px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .help b { color: var(--fg); font-weight: 600; }
  .credit { font-size: 11px; color: rgba(20, 27, 33, 0.85); text-shadow: 0 0 3px rgba(255, 255, 255, 0.8); pointer-events: none; }
  .pads { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: none; justify-content: space-between; pointer-events: none; }
  .pads > div { display: flex; gap: 12px; pointer-events: auto; }
  .pad { width: 68px; height: 68px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 600 15px/1 var(--display); touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad.tall { height: 92px; }
  .pad.on { background: rgba(255, 106, 26, 0.85); }
  @media (pointer: coarse) { .pads { display: flex; } .help { display: none; } .bl { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); } }
  @media (max-width: 520px) { #map { width: 120px; height: 120px; } select { max-width: 120px; } #speed { font-size: 36px; } }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5; text-align: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  #loading h2 { font: 600 26px/1.2 var(--display); margin: 0 0 8px; text-wrap: balance; }
  #loading p { margin: 0; color: var(--muted); font-size: 14px; }
</style>

</head>
<body>
<div class="stage" id="stage"><canvas id="gl" tabindex="0" aria-label="Driving view: an orange 1978 Chrysler Sigma on the streets of Hobart"></canvas></div>

<div class="hud tl">
  <div class="panel dash">
    <h1>1978 Chrysler Sigma</h1>
    <div class="speedrow"><span id="speed">0</span><span class="unit">km/h</span></div>
    <div id="street">&nbsp;</div>
    <div id="info">&nbsp;</div>
  </div>
</div>

<div class="hud tr">
  <div class="panel mapwrap"><canvas id="map" aria-label="Street map around the car"></canvas></div>
  <select id="places" aria-label="Jump to a place"></select>
  <div class="row">
    <button class="btn" id="camBtn">Driver view</button>
    <button class="btn" id="resetBtn">Back on road</button>
  </div>
</div>

<div class="hud bl">
  <div class="panel help"><b>W A S D</b> or <b>arrows</b> to drive &middot; <b>Space</b> handbrake &middot; <b>C</b> view &middot; <b>R</b> back on road &middot; drag to look around</div>
  <div class="credit">Streets &copy; OpenStreetMap contributors &middot; Heights: Mapzen terrain tiles</div>
</div>

<div class="pads" aria-hidden="true">
  <div><button class="pad" id="tl">&#9664;</button><button class="pad" id="tr">&#9654;</button></div>
  <div><button class="pad" id="tb">Brake</button><button class="pad tall" id="tg">Go</button></div>
</div>

<div id="loading"><div><h2>Hobart, by Sigma</h2><p id="loadmsg">Starting up&hellip;</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var THREE = window.THREE;
  function $(id) { return document.getElementById(id); }
  var stage = $('stage'), canvas = $('gl'), loadEl = $('loading'), loadMsg = $('loadmsg');
  if (!THREE) { loadMsg.textContent = 'The 3D engine could not load.'; return; }
  function C(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function sstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function hash(a, b, c) {
    var h = (a | 0) * 374761393 + (b | 0) * 668265263 + (c | 0) * 2147483647;
    h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var scene = new THREE.Scene();
  var SKY = '#b9d0e4';
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(C(SKY), 700, 16000);
  var camera = new THREE.PerspectiveCamera(55, 1, 0.3, 46000);

  (function () {
    var c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    var g = c.getContext('2d'), grad = g.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0, '#8fa9c4'); grad.addColorStop(0.46, '#e6edf3'); grad.addColorStop(0.5, '#6b6f72'); grad.addColorStop(1, '#2a2c2e');
    g.fillStyle = grad; g.fillRect(0, 0, 1024, 512);
    g.fillStyle = '#ffffff';
    [[90, 70, 200, 60], [400, 40, 240, 50], [740, 80, 220, 60], [560, 180, 120, 30], [940, 160, 80, 40], [250, 180, 90, 30]].forEach(function (r) { g.fillRect(r[0], r[1], r[2], r[3]); });
    var tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping; tex.encoding = THREE.sRGBEncoding;
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromEquirectangular(tex).texture;
    tex.dispose(); pm.dispose();
  })();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x77705f, 0.85));
  var SUN = new THREE.Vector3(0.45, 0.80, -0.40).normalize();     /* the sun sits to the north here */
  var sun = new THREE.DirectionalLight(0xfff4e2, 0.95);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -9; sun.shadow.camera.right = 9; sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 90; sun.shadow.bias = -0.0008;
  scene.add(sun); scene.add(sun.target);

  function buildSigma() {
  /* ---------- small maths helpers ---------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function sstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function smin(a, b, k) { var h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; }
  /* Monotone cubic through [x, y] points, clamped at both ends. */
  function curve(pts) {
    var n = pts.length, h = [], d = [], m = [], i;
    for (i = 0; i < n - 1; i++) { h.push(pts[i + 1][0] - pts[i][0]); d.push((pts[i + 1][1] - pts[i][1]) / h[i]); }
    m.push(d[0]);
    for (i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] <= 0) m.push(0);
      else { var w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m.push((w1 + w2) / (w1 / d[i - 1] + w2 / d[i])); }
    }
    m.push(d[n - 2]);
    return function (x) {
      if (x <= pts[0][0]) return pts[0][1];
      if (x >= pts[n - 1][0]) return pts[n - 1][1];
      var k = 0;
      while (x > pts[k + 1][0]) k++;
      var t = (x - pts[k][0]) / h[k], t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * pts[k][1] + (t3 - 2 * t2 + t) * h[k] * m[k] +
             (-2 * t3 + 3 * t2) * pts[k + 1][1] + (t3 - t2) * h[k] * m[k + 1];
    };
  }

  /* ==========================================================
     BODY DEFINITION
     x runs forward, y up, z to the driver's (right) side. Metres.
     Every number below was read off the owner's side-on photo after
     solving for the camera position, then checked against the
     front, rear and three-quarter photos.
     ========================================================== */
  var AX_F = 1.425, AX_R = -1.090;          /* axle lines: 2,515 mm wheelbase */
  var TRACK_F = 1.350, TRACK_R = 1.340;
  var TYRE_R = 0.305, TYRE_W = 0.215;
  var X_NOSE = 2.085, X_TAIL = -2.042;      /* body ends; bumpers reach +/-2.150 */

  /*BODYDATA*/
  /* shoulder line: fender top edge, belt under the glass, rear hip */
  var yS = curve([[-2.042, 0.925], [-1.94, 0.945], [-1.74, 0.977], [-1.52, 1.018], [-1.42, 1.040], [-0.97, 1.003],
                  [-0.63, 0.982], [-0.14, 0.949], [0.32, 0.949], [0.70, 0.951], [0.95, 0.937], [1.29, 0.900],
                  [1.64, 0.859], [1.94, 0.800], [2.085, 0.772]]);
  var zS = curve([[-2.042, 0.700], [-1.90, 0.722], [-1.42, 0.765], [-0.90, 0.785], [0.70, 0.785], [1.00, 0.775], [1.60, 0.760], [2.085, 0.740]]);
  /* widest line, where the rubbing strip sits */
  var zM = curve([[-2.042, 0.785], [-1.70, 0.812], [-1.20, 0.828], [-0.60, 0.830], [0.60, 0.830], [1.20, 0.825], [1.70, 0.810], [2.085, 0.790]]);
  var yM = curve([[-2.042, 0.700], [-1.37, 0.693], [-0.63, 0.685], [-0.12, 0.678], [0.42, 0.670], [0.84, 0.663], [1.18, 0.659], [1.61, 0.655], [1.87, 0.637], [2.085, 0.625]]);
  var PIN = [[-1.99, 0.837], [-0.63, 0.835], [-0.12, 0.827], [0.42, 0.816], [0.84, 0.809], [1.27, 0.797], [1.60, 0.779], [1.90, 0.760]];
  var yP = curve(PIN);
  /* lower edge of the body side */
  var yB = curve([[-2.042, 0.520], [-1.93, 0.507], [-1.84, 0.442], [-1.63, 0.401], [-1.41, 0.366], [-0.67, 0.295], [0.96, 0.292],
                  [1.69, 0.355], [1.83, 0.355], [1.94, 0.475], [2.085, 0.500]]);
  var crown = curve([[-2.042, 0.020], [-1.6, 0.014], [-1.0, 0.0], [0.8, 0.0], [1.1, 0.020], [2.085, 0.014]]);
  var roofC = curve([[-1.00, 1.360], [-0.90, 1.372], [-0.70, 1.382], [-0.47, 1.387], [-0.235, 1.389], [0.0, 1.385], [0.24, 1.372], [0.40, 1.356]]);
  var TUM = 2.0;                             /* side glass leans in 1 in 2 */
  var WS = { x0: 0.882, y0: 0.954, slope: 0.775, bow: 0.10 };
  var RG = { x0: -1.508, y0: 1.045, slope: 0.50, bow: 0.05 };
  var ROOF_DROP = 0.042;
  /*ENDBODYDATA*/

  function zG(x) { return zS(x) - 0.02; }
  function deck(x, z) { var t = Math.min(1, Math.abs(z) / zS(x)); return yS(x) + crown(x) * (1 - Math.pow(t, 2.4)); }
  function sidePl(x, z) { return yS(x) + (zG(x) - Math.abs(z)) * TUM; }
  function roofY(x, z) { return roofC(x) - ROOF_DROP * Math.pow(Math.abs(z) / 0.6, 2.3); }
  function wsY(x, z) { return WS.y0 + (WS.x0 - WS.bow * Math.pow(z / 0.7, 2) - x) * WS.slope; }
  function rgY(x, z) { return RG.y0 + (x - (RG.x0 + RG.bow * Math.pow(z / 0.62, 2))) * RG.slope; }
  function capTop(x, z) { return smin(smin(roofY(x, z), wsY(x, z), 0.055), rgY(x, z), 0.055); }
  function topY(x, z) { return Math.max(deck(x, z), Math.min(capTop(x, z), sidePl(x, z))); }
  /* half-width of the cabin top at station x: where the glass or roof meets the side plane, or the deck */
  function zRail(x) {
    var zg = zG(x);
    function m(z) { var c = capTop(x, z); return Math.min(c - deck(x, z) - 0.0005, sidePl(x, z) - c); }
    if (m(0) <= 0) return 0;
    if (m(zg) > 0) return zg;
    var lo = 0, hi = zg;
    for (var i = 0; i < 28; i++) { var mid = (lo + hi) / 2; if (m(mid) > 0) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }
  /* body side below the shoulder: z as a function of height */
  function sideProfile(x) {
    var b = yB(x), s = yS(x), mY = yM(x), zm = zM(x), zs = zS(x), d = zm - zs;
    var p = Math.min(yP(x), s - 0.07);
    if (mY > p - 0.03) mY = p - 0.03;
    return curve([[b, zm - 0.050], [b + 0.07, zm - 0.016], [mY, zm], [p, zm - 0.12 * d], [s - 0.045, zm - 0.35 * d], [s - 0.012, zs + 0.22 * d], [s, zs]]);
  }
  function sideZ(x, y) { return sideProfile(x)(y); }
  /* rake and plan bow of the nose and tail, applied to everything built in body coordinates */
  function warpX(x, y, z) {
    var wf = sstep(1.78, X_NOSE, x), wr = sstep(-1.78, X_TAIL, x), o = 0;
    if (wf > 0) {
      var rk = y > 0.5 ? 0.23 * Math.max(0, 0.775 - y) : 0.063 + (0.5 - y) * 0.75;
      o -= wf * (0.055 * Math.pow(z / 0.78, 2) + rk);
    }
    if (wr > 0) {
      var rr = y > 0.52 ? -0.20 * Math.max(0, 0.90 - y) : -0.076 + (0.52 - y) * 1.4;
      o += wr * (0.035 * Math.pow(z / 0.75, 2) + rr);
    }
    return x + o;
  }
  function P(x, y, z) { return new THREE.Vector3(warpX(x, y, z), y, z); }
  function sidePoint(x, y, sgn, off) {
    var z = sideZ(x, y) + (off || 0);
    return new THREE.Vector3(warpX(x, y, z), y, sgn * z);
  }

  /* ---------- GLSL generators for outlines traced in body coordinates ---------- */
  function f4(n) { var s = (Math.round(n * 1e4) / 1e4).toFixed(4); return s; }
  function glslSd(name, pts) {
    var s = 'float ' + name + '(vec2 p){ float d=1e9; float sg=1.0; vec2 e; vec2 w; vec2 b; bool c1; bool c2; bool c3;\n';
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], q = pts[(i + pts.length - 1) % pts.length];
      s += ' e=vec2(' + f4(q[0] - a[0]) + ',' + f4(q[1] - a[1]) + '); w=p-vec2(' + f4(a[0]) + ',' + f4(a[1]) + ');' +
           ' b=w-e*clamp(dot(w,e)/dot(e,e),0.0,1.0); d=min(d,dot(b,b));' +
           ' c1=p.y>=' + f4(a[1]) + '; c2=p.y<' + f4(q[1]) + '; c3=e.x*w.y>e.y*w.x; if((c1&&c2&&c3)||(!c1&&!c2&&!c3)) sg=-sg;\n';
    }
    return s + ' return sg*sqrt(d);}\n';
  }
  function glslLines(name, lines) {
    var s = 'float ' + name + '(vec2 p){ float d=1e9; vec2 e; vec2 w; vec2 b;\n';
    lines.forEach(function (pts) {
      for (var i = 0; i < pts.length - 1; i++) {
        var a = pts[i], q = pts[i + 1];
        s += ' e=vec2(' + f4(q[0] - a[0]) + ',' + f4(q[1] - a[1]) + '); w=p-vec2(' + f4(a[0]) + ',' + f4(a[1]) + ');' +
             ' b=w-e*clamp(dot(w,e)/dot(e,e),0.0,1.0); d=min(d,dot(b,b));\n';
      }
    });
    return s + ' return sqrt(d);}\n';
  }
  function glslPL(name, pts) {
    var s = 'float ' + name + '(float x){ float y=' + f4(pts[0][1]) + ';\n';
    for (var i = 0; i < pts.length - 1; i++) {
      s += ' y+=' + f4(pts[i + 1][1] - pts[i][1]) + '*clamp((x-(' + f4(pts[i][0]) + '))/' + f4(pts[i + 1][0] - pts[i][0]) + ',0.0,1.0);\n';
    }
    return s + ' return y;}\n';
  }
  /* Chaikin-style smoothing of a traced polyline */
  function smoothLine(pts, closed) {
    var out = [], n = pts.length;
    for (var i = 0; i < n - (closed ? 0 : 1); i++) {
      var a = pts[i], b = pts[(i + 1) % n];
      if (!closed && i === 0) out.push(a);
      out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
      out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      if (!closed && i === n - 2) out.push(b);
    }
    return out;
  }
  /* round every corner of a closed outline with a fixed radius */
  function roundPoly(pts, r) {
    var out = [], n = pts.length;
    for (var i = 0; i < n; i++) {
      var p = pts[i], a = pts[(i + n - 1) % n], b = pts[(i + 1) % n];
      var la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]), rr = Math.min(r, 0.45 * la, 0.45 * lb);
      var s0 = [p[0] + (a[0] - p[0]) * rr / la, p[1] + (a[1] - p[1]) * rr / la], s1 = [p[0] + (b[0] - p[0]) * rr / lb, p[1] + (b[1] - p[1]) * rr / lb];
      for (var k = 0; k <= 4; k++) {
        var t = k / 4, u = 1 - t;
        out.push([u * u * s0[0] + 2 * u * t * p[0] + t * t * s1[0], u * u * s0[1] + 2 * u * t * p[1] + t * t * s1[1]]);
      }
    }
    return out;
  }
  function patch(mat, o) {
    mat.onBeforeCompile = function (sh) {
      sh.vertexShader = 'varying vec3 vLoc;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vLoc = position;');
      var fs = 'varying vec3 vLoc;\n' + (o.head || '') + sh.fragmentShader;

      var g = new THREE.Group(), tall = hash(i, 3, 1) > 0.7;
      var b = new THREE.Mesh(body, new THREE.MeshLambertMaterial({ color: C(cols[i % cols.length]) })); b.position.y = 0.62; if (tall) { b.scale.y = 1.5; b.position.y = 0.78; }
      var c = new THREE.Mesh(cabin, glass); c.position.set(-0.25, tall ? 1.42 : 1.16, 0); if (tall) c.scale.x = 1.5;
      var a1 = new THREE.Mesh(axle, tyre); a1.position.set(1.3, 0.31, 0);
      var a2 = new THREE.Mesh(axle, tyre); a2.position.set(-1.3, 0.31, 0);
      g.add(b, c, a1, a2); g.rotation.order = 'YZX'; g.visible = false; scene.add(g);
      others.push({ g: g, i: -1, t: 0, dir: 1, v: 0, lane: hash(i, 9, 2) > 0.5 ? 1 : -1, k: 0.8 + 0.22 * hash(i, 5, 5), x: 0, z: 0 });
    }
  })();
  function spawnOther(o, near) {
    for (var tries = 0; tries < 24; tries++) {
      var a = Math.random() * Math.PI * 2, r = (near ? 60 : 170) + Math.random() * 330;
      var cx = ((car.x + Math.cos(a) * r + HALF) / GC) | 0, cz = ((car.z + Math.sin(a) * r + HALF) / GC) | 0;
      if (cx < 0 || cz < 0 || cx >= GN || cz >= GN) continue;
      var c = cz * GN + cx, n = CS[c + 1] - CS[c];
      if (!n) continue;
      var i = CI[CS[c] + ((Math.random() * n) | 0)], e = PE[i];
      if (Math.hypot(PX[i] - car.x, PZ[i] - car.z) < 45) continue;
      o.i = i; o.t = 0; o.dir = (EF[e] & 1) ? 1 : (Math.random() < 0.5 ? 1 : -1); o.v = ESP[e] / 3.6 * o.k * 0.7;
      o.g.visible = true;
      return;
    }
    o.i = -1; o.g.visible = false;
  }
  function nextEdge(o, v, from) {

      var f = VAI[i] >> 1, end = VAI[i] & 1;
      if (f === from && VAS[v + 1] - VAS[v] > 1) continue;
      if (end === 1 && (EF[f] & 1)) continue;
      opts.push(VAI[i]);
    }
    if (!opts.length) return false;
    var pick = opts[(Math.random() * opts.length) | 0], f2 = pick >> 1;
    if (pick & 1) { o.i = ES[f2 + 1] - 2; o.t = PL[o.i + 1] - PL[o.i]; o.dir = -1; } else { o.i = ES[f2]; o.t = 0; o.dir = 1; }
    return true;
  }
  function stepTraffic(dt) {
    for (var q = 0; q < others.length; q++) {
      var o = others[q];
      if (o.i < 0 || Math.hypot(o.x - car.x, o.z - car.z) > 680) { spawnOther(o, false); if (o.i < 0) continue; }
      var e = PE[o.i], a = ES[e], b = ES[e + 1] - 1, sl = PL[o.i + 1] - PL[o.i];
      var toEnd = o.dir > 0 ? PL[b] - PL[o.i] - o.t : PL[o.i] + o.t, target = ESP[e] / 3.6 * o.k;
      if (toEnd < 14) target = Math.min(target, 5.5 + toEnd * 0.4);
      /* hold back behind the player's car */
      var dxp = car.x - o.x, dzp = car.z - o.z, fxo = Math.cos(o.g.rotation.y), fzo = -Math.sin(o.g.rotation.y);
      var ahead = dxp * fxo + dzp * fzo, side = Math.abs(dxp * fzo - dzp * fxo);
      if (ahead > 0 && ahead < 16 && side < 2.4) target = Math.min(target, Math.max(0, car.v * (fxo * Math.cos(car.h) - fzo * Math.sin(car.h))) * (ahead - 6) / 10);
      o.v += clamp(Math.max(0, target) - o.v, -6 * dt, 2.2 * dt);
      o.t += o.dir * o.v * dt;
      var ok = true, guard = 0;

        sl = PL[o.i + 1] - PL[o.i];

        else if (o.t < 0) { if (o.i <= a) ok = nextEdge(o, EA[e], e); else { o.i--; o.t += PL[o.i + 1] - PL[o.i]; } }
        else break;
        e = PE[o.i]; a = ES[e]; b = ES[e + 1] - 1;

      if (!ok) { spawnOther(o, false); continue; }
      sl = PL[o.i + 1] - PL[o.i] || 1;
      var t = clamp(o.t / sl, 0, 1), dx = (PX[o.i + 1] - PX[o.i]) / sl * o.dir, dz = (PZ[o.i + 1] - PZ[o.i]) / sl * o.dir;
      var w = EW[e], off = (EF[e] & 1) ? (w >= 7 ? o.lane * w / 4 : 0) : w / 4;
      o.x = PX[o.i] + (PX[o.i + 1] - PX[o.i]) * t + dz * off; o.z = PZ[o.i] + (PZ[o.i + 1] - PZ[o.i]) * t - dx * off;
      var hy = Math.atan2(-dz, dx), dh = hy - o.g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));

      o.g.rotation.set(0, o.g.rotation.y + dh * Math.min(1, dt * 8), Math.atan2((PH[o.i + 1] - PH[o.i]) * o.dir, sl));
    }
  }

  /* ==========================================================
     CAMERA, INPUT AND HUD
     ========================================================== */
  var camYaw = 0, camDist = 8.2, camMode = 0, orbit = { yaw: 0, pitch: 0, idle: 0, drag: false, px: 0, py: 0 };
  var camPos = new THREE.Vector3(), look = new THREE.Vector3();
  function stepCamera(dt) {
    if (camMode === 1) {
      var cs = Math.cos(car.h), sn = Math.sin(car.h);
      camera.near = 0.12; camera.fov = 68; camera.updateProjectionMatrix();
      carG.updateMatrixWorld();
      camPos.set(0.02, 1.20, 0.36).applyMatrix4(carG.matrixWorld);
      look.set(6, 0.92 - orbit.pitch * 4, 0.36 - orbit.yaw * 6).applyMatrix4(carG.matrixWorld);
      camera.position.copy(camPos); camera.up.set(0, 1, 0); camera.lookAt(look);
      return;
    }
    var dy = car.h - camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));

    orbit.idle += dt;
    if (!orbit.drag && orbit.idle > 2.5 && Math.abs(car.v) > 1.5) { var f = Math.exp(-dt * 2.2); orbit.yaw *= f; orbit.pitch *= f; }
    var yaw = camYaw + orbit.yaw, p = clamp(0.24 + orbit.pitch, 0.03, 1.35), d = camDist + Math.abs(car.v) * 0.05;
    camPos.set(car.x - Math.cos(yaw) * d * Math.cos(p), car.y + 1.25 + d * Math.sin(p), car.z + Math.sin(yaw) * d * Math.cos(p));
    var floor = terrainH(camPos.x, camPos.z, 4) + 0.55;
    if (camPos.y < floor) camPos.y = floor;
    camera.position.copy(camPos);
    look.set(car.x, car.y + 1.15, car.z); camera.lookAt(look);
  }
  function setCam(m) {
    camMode = m; orbit.yaw = 0; orbit.pitch = 0;
    camera.near = m ? 0.12 : 0.3; camera.fov = m ? 68 : 55; camera.updateProjectionMatrix();
    $('camBtn').textContent = m ? 'Chase view' : 'Driver view';
  }
  window.addEventListener('keydown', function (ev) {
    if (ev.target && /SELECT|INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    keys[ev.code] = true;
    if (ev.code === 'KeyC') setCam(camMode ? 0 : 1);
    if (ev.code === 'KeyR') placeOnRoad(car.x, car.z);
    if (/^Arrow|Space/.test(ev.code)) ev.preventDefault();
  });
  window.addEventListener('keyup', function (ev) { keys[ev.code] = false; });
  window.addEventListener('blur', function () { keys = {}; });
  canvas.addEventListener('pointerdown', function (ev) { orbit.drag = true; orbit.px = ev.clientX; orbit.py = ev.clientY; canvas.setPointerCapture(ev.pointerId); canvas.focus(); });
  canvas.addEventListener('pointermove', function (ev) {
    if (!orbit.drag) return;
    orbit.yaw -= (ev.clientX - orbit.px) * 0.006; orbit.pitch += (ev.clientY - orbit.py) * 0.004;
    orbit.pitch = clamp(orbit.pitch, -0.22, 1.1); if (camMode) orbit.yaw = clamp(orbit.yaw, -1.2, 1.2);
    orbit.px = ev.clientX; orbit.py = ev.clientY; orbit.idle = 0;
  });
  function endDrag() { orbit.drag = false; orbit.idle = 0; }
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', function (ev) { camDist = clamp(camDist * (ev.deltaY > 0 ? 1.1 : 0.9), 4.5, 60); ev.preventDefault(); }, { passive: false });
  [['tl', 'l'], ['tr', 'r'], ['tg', 'g'], ['tb', 'b']].forEach(function (p) {
    var el = $(p[0]);
    function set(v) { return function (ev) { touch[p[1]] = v; el.classList.toggle('on', !!v); ev.preventDefault(); }; }
    el.addEventListener('pointerdown', set(1)); el.addEventListener('pointerup', set(0));
    el.addEventListener('pointercancel', set(0)); el.addEventListener('pointerleave', set(0));
    el.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  });
  $('camBtn').addEventListener('click', function () { setCam(camMode ? 0 : 1); canvas.focus(); });
  $('resetBtn').addEventListener('click', function () { placeOnRoad(car.x, car.z); canvas.focus(); });
  var LAT0 = -42.8826, LON0 = 147.3290, KN = 6371000 * Math.PI / 180, KX = KN * Math.cos(LAT0 * Math.PI / 180);
  var PLACES = [['Hobart city centre', -42.8826, 147.3290], ['Tasman Bridge', -42.8672, 147.3395], ['kunanyi / Mt Wellington summit', -42.8958, 147.2372],
                ['Sandy Bay', -42.9015, 147.3330], ['Glenorchy', -42.8330, 147.2760], ['Kingston', -42.9760, 147.3050],
                ['Hobart Airport', -42.8376, 147.5010], ['Richmond', -42.7355, 147.4385], ['Bridgewater', -42.7385, 147.2330], ['Sorell', -42.7820, 147.5640]];
  PLACES.forEach(function (p, i) { var o = document.createElement('option'); o.value = i; o.textContent = p[0]; $('places').appendChild(o); });
  $('places').addEventListener('change', function () {
    var p = PLACES[+this.value];
    placeOnRoad((p[2] - LON0) * KX, -(p[1] - LAT0) * KN);
    needWarm = true; canvas.focus();
  });

  var mm = $('map'), mg = mm.getContext('2d'), MMS = 168, MMR = 320;
  (function () { var dpr = Math.min(2, window.devicePixelRatio || 1); mm.width = MMS * dpr; mm.height = MMS * dpr; mg.scale(dpr, dpr); })();
  var MCOL = ['#ffb347', '#ffb347', '#ffd98a', '#ffffff', '#ffffff', '#c9ced3', '#c9ced3', '#c9ced3'];
  function drawMap() {
    var s = MMS / (2 * MMR), ox = MMS / 2 - car.x * s, oz = MMS / 2 - car.z * s;
    mg.fillStyle = '#26313a'; mg.fillRect(0, 0, MMS, MMS);
    var x0 = Math.max(0, ((car.x - MMR + HALF) / GC) | 0), x1 = Math.min(GN - 1, ((car.x + MMR + HALF) / GC) | 0);
    var z0 = Math.max(0, ((car.z - MMR + HALF) / GC) | 0), z1 = Math.min(GN - 1, ((car.z + MMR + HALF) / GC) | 0);
    for (var pass = 0; pass < 2; pass++) {
      mg.beginPath();
      for (var cz = z0; cz <= z1; cz++) for (var cx = x0; cx <= x1; cx++) for (var k = CS[cz * GN + cx]; k < CS[cz * GN + cx + 1]; k++) {

    others.forEach(function (o) { if (o.i >= 0) mg.fillRect(o.x * s + ox - 1.5, o.z * s + oz - 1.5, 3, 3); });
    mg.save(); mg.translate(MMS / 2, MMS / 2); mg.rotate(-car.h);
    mg.fillStyle = '#ff6a1a'; mg.strokeStyle = '#fff'; mg.lineWidth = 1.5;
    mg.beginPath(); mg.moveTo(8, 0); mg.lineTo(-6, 5); mg.lineTo(-3, 0); mg.lineTo(-6, -5); mg.closePath(); mg.fill(); mg.stroke();

  }
  var hudT = 0, COMPASS = ['E', 'NE', 'N', 'NW', 'W', 'SW', 'S', 'SE'];
  function drawHud(dt) {
    hudT += dt; if (hudT < 0.12) return; hudT = 0;
    $('speed').textContent = Math.round(Math.abs(car.v) * 3.6);
    var nm = '';
    if (car.edge >= 0) nm = NAMES[ENM[car.edge]];
    else if (nearRoad(car.x, car.z, 25, 0)) nm = NAMES[ENM[Q.e]];
    $('street').textContent = nm || (car.onRoad ? 'Unnamed road' : 'Off road');
    var a = ((car.h % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

    drawMap();
  }

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;

  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);

  /* ==========================================================
     START-UP AND MAIN LOOP
     ========================================================== */
  var needWarm = false, running = false, last = 0;
  function warm(done) {
    plan(car.x, car.z);
    var total = queue.length;
    (function go() {
      buildSome(40);
      loadMsg.textContent = 'Building the land around you… ' + Math.round(100 * (1 - queue.length / Math.max(1, total))) + '%';
      if (queue.length) setTimeout(go, 0); else { plan(car.x, car.z); done(); }
    })();
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (!running) return;
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    if (needWarm) { needWarm = false; plan(car.x, car.z); buildSome(400); plan(car.x, car.z); }
    stepCar(dt);
    stepTraffic(dt);
    if (Math.hypot(car.x - lastPlan.x, car.z - lastPlan.z) > 14 || (pending && !queue.length)) { plan(car.x, car.z); pending = false; }
    if (queue.length) { buildSome(5); pending = true; }
    stepCamera(dt);
    sun.position.set(car.x + SUN.x * 50, car.y + SUN.y * 50, car.z + SUN.z * 50);
    sun.target.position.set(car.x, car.y, car.z);
    water.position.set(car.x, 0, car.z);
    drawHud(dt);
    renderer.render(scene, camera);
  }
  var pending = false;
  window.__sim = { car: car, keys: keys, place: placeOnRoad, chunks: chunks, stats: function () { return { edges: NE, points: PX ? PX.length : 0, chunks: chunks.size, queue: queue.length, calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; } };

  loadMsg.textContent = 'Loading the Hobart map…';
  Promise.all([loadImage('roads.png'), loadImage('terrain.png')])
    .then(function (res) {
      loadMsg.textContent = 'Reading heights and streets…';
      return new Promise(function (ok) { setTimeout(function () { decodeDem(res[1]); parseRoads(imageBytes(res[0])); roadHeights(); buildIndex(); buildUrban(); ok(); }, 30); });
    })
    .then(function () {
      stampP = new Uint32Array(PX.length); stampV = new Uint32Array(NV);
      placeOnRoad(0, 0);
      resize();
      warm(function () {
        others.forEach(function (o) { spawnOther(o, true); });
        loadEl.hidden = true; running = true; last = performance.now();
        canvas.focus();
      });
    })
    .catch(function (err) { loadMsg.textContent = 'Could not load the map data. ' + (err && err.message ? err.message : ''); });
  requestAnimationFrame(frame);
})();
